services:
  chordsync:
    build: .
    ports:
      - "8000:8000"
    environment:
      CHORDSYNC_DEMUCS_DEVICE: cpu
      CHORDSYNC_MAX_UPLOAD_MB: 250
      CHORDSYNC_MAX_CONCURRENT_INFERENCE: 1
      CHORDSYNC_RUNTIME_TTL_SEC: 21600
    volumes:
      - chordsync-runtime:/tmp/chordsync-runtime
    restart: unless-stopped
volumes:
  chordsync-runtime:
